<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dcebdc">
  <title>今天吃什麼</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <header class="sheet-head">
    <h1>今天吃什麼</h1>
    <form id="search-form" class="search" role="search">
      <input id="search-input" type="search" placeholder="想吃什麼，或輸入店名" aria-label="想吃什麼，或輸入店名" enterkeyhint="search" autocomplete="off">
      <button type="submit">查詢</button>
    </form>
    <div id="categories" class="categories" role="group" aria-label="類型"></div>
    <div class="filters">
      <label><input id="open-only" type="checkbox">只看營業中</label>
      <label><input id="within-500" type="checkbox">500 公尺內</label>
    </div>
  </header>
  <main>
    <p id="status" class="status" role="status"></p>
    <table id="results" class="results" hidden>
      <thead><tr><th scope="col">店名</th><th scope="col">距離</th></tr></thead>
      <tbody id="results-body"></tbody>
    </table>
  </main>
  <script type="module" src="app.js?v=2"></script>
</body>
</html>
